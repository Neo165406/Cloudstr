<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — cloudStr</title>
  <meta name="robots" content="noindex, follow">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="page-loader"><div class="loader-ring"></div></div>
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <a href="index.html" class="logo logo-image" aria-label="CLOUDSTR home"><img src="assets/cloudstr-logo.svg" alt="CLOUDSTR" /></a>
      <nav class="admin-nav">
        <a href="#" class="active">Dashboard</a>
        <a href="#products-panel">Products</a>
        <a href="index.html">View Storefront</a>
      </nav>
    </aside>
    <div class="admin-main">
      <div class="admin-topbar">
        <div><h1>Dashboard</h1></div>
        <button class="btn btn-primary" id="add-product-btn">Add product</button>
      </div>
      <div class="stat-cards">
        <div class="stat-card"><div class="stat-top"><span class="stat-label">Total products</span></div><div class="stat-value" id="stat-total">0</div></div>
        <div class="stat-card"><div class="stat-top"><span class="stat-label">Low stock</span></div><div class="stat-value" id="stat-low-stock">0</div></div>
        <div class="stat-card"><div class="stat-top"><span class="stat-label">Out of stock</span></div><div class="stat-value" id="stat-out-stock">0</div></div>
        <div class="stat-card"><div class="stat-top"><span class="stat-label">Orders placed</span></div><div class="stat-value" id="stat-orders">0</div></div>
      </div>
      <div class="admin-panel" id="products-panel">
        <div class="admin-panel-head"><h3>Product management</h3></div>
        <table class="admin-table">
          <thead><tr><th>Product</th><th>Category</th><th>Status</th><th>Price</th><th>Actions</th></tr></thead>
          <tbody id="admin-product-body"></tbody>
        </table>
      </div>
      <div class="admin-panel" id="best-panel" style="display:none"><div class="admin-panel-head"><h3>Best slider</h3></div><table class="admin-table"><tbody id="admin-best-body"></tbody></table></div>
      <div class="admin-panel" id="hero-panel" style="display:none"><div class="admin-panel-head"><h3>Hero</h3></div><table class="admin-table"><tbody id="admin-hero-body"></tbody></table></div>
      <div class="admin-panel" id="models-panel" style="display:none"><div class="admin-panel-head"><h3>Models</h3></div><table class="admin-table"><tbody id="admin-models-body"></tbody></table></div>
      <div class="admin-panel" id="reels-panel" style="display:none"><div class="admin-panel-head"><h3>Reels</h3></div><div id="admin-reels-body"></div></div>
      <div class="admin-panel" id="orders-panel" style="display:none"><div class="admin-panel-head"><h3>Orders</h3></div><table class="admin-table"><tbody id="admin-orders-body"></tbody></table></div>
    </div>
  </div>
  <div class="modal-scrim" id="modal-scrim">
    <div class="modal-box">
      <div class="modal-head"><h3 id="modal-title">Add product</h3>
        <button class="modal-close" id="modal-close" aria-label="Close">×</button>
      </div>
      <form id="product-form">
        <div class="form-group"><label for="f-name">Product name</label><input type="text" id="f-name" name="name" required></div>
        <div class="form-group"><label for="f-category">Category</label>
          <select id="f-category" name="category">
            <option value="disposables">Disposables</option>
            <option value="nic-salts">Nic Salts</option>
            <option value="pod-devices">Pod Devices</option>
            <option value="podmod-devices">Podmod Devices</option>
            <option value="coils-cartridges">Coils & Cartridges</option>
            <option value="freebase-eliquid">Freebase E-liquid</option>
          </select>
        </div>
        <div class="form-row-2">
          <div class="form-group"><label for="f-price">Price (৳)</label><input type="number" id="f-price" name="price" min="0" step="1" required></div>
          <div class="form-group"><label for="f-stock">Stock qty</label><input type="number" id="f-stock" name="stock" min="0" step="1" required></div>
        </div>
        <div class="form-group"><label for="f-description">Description</label><textarea id="f-description" name="description" rows="4"></textarea></div>
        <div class="form-group" style="display:flex;align-items:center;gap:.55rem;">
          <input type="checkbox" id="f-hide-description" name="hideDescription" style="width:auto;margin:0;">
          <label for="f-hide-description" style="margin:0;">Hide description on product page</label>
        </div>
        <div class="form-group"><label>Product specifications</label><div id="spec-inputs"></div><button type="button" class="btn btn-sm btn-ghost" id="add-spec-btn">+ Add specification</button></div>
        <div class="form-group"><label>Product images</label><div id="image-inputs"></div><button type="button" class="btn btn-sm btn-ghost" id="add-image-btn">+ Add another image</button></div>
        <button type="submit" class="btn btn-primary btn-block">Save product</button>
      </form>
    </div>
  </div>
  <div class="modal-scrim" id="confirm-scrim">
    <div class="modal-box" style="max-width:380px;">
      <div class="modal-head"><h3>Delete product</h3><button class="modal-close" id="confirm-close">×</button></div>
      <p id="confirm-text" style="color:var(--muted);font-size:0.88rem;margin-bottom:1.5rem;"></p>
      <div style="display:flex;gap:0.75rem;">
        <button class="btn btn-ghost btn-block" id="confirm-cancel">Cancel</button>
        <button class="btn btn-block" id="confirm-delete-btn" style="background:var(--danger);border-color:var(--danger);color:#fff;">Delete</button>
      </div>
    </div>
  </div>
  <div id="toast-region" aria-live="polite"></div>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/products.js"></script>
  <script src="js/card-motion.js"></script>
  <script src="js/featured.js"></script>
  <script src="js/cart.js"></script>
  <script>document.addEventListener("DOMContentLoaded", () => { const l = document.getElementById("page-loader"); setTimeout(() => l && l.classList.add("hidden"), 150); });</script>
  <script src="js/admin.js"></script>
</body>
</html>
